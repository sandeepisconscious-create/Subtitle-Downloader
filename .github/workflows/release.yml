name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release with Subtitle_Downloader.zip
        uses: softprops/action-gh-release@v2
        with:
          files: Subtitle_Downloader.zip
          generate_release_notes: true
